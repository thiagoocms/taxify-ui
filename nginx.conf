map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /taxify-service/ {
        proxy_pass http://backend:5000/taxify-service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # O Caddy termina o HTTPS e fala HTTP com este nginx: repassa o protocolo original
        # (https) em vez do $scheme local (http). Sem o Caddy na frente, cai para o $scheme.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Arquivos do build têm hash no nome (main-XXXX.js, chunk-XXXX.js): podem ficar em cache
    # para sempre e, se não existirem (versão antiga pedida depois de um deploy), devolvem
    # 404 - nunca o index.html, que o navegador recusaria como script ("MIME type text/html").
    location ~* \.(?:js|mjs|css|map|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html nunca em cache: sempre aponta para os arquivos do deploy atual.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

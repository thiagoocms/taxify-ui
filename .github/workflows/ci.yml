# CI do frontend (taxify-ui): npm ci -> testes (Karma/ChromeHeadless) -> build de produção -> imagem Docker.
# NÃO faz deploy. Deploy na EC2 só com aprovação explícita do Tony (fora deste workflow).
# Lint: o projeto ainda não tem alvo "lint" (sem angular-eslint); o passo roda só se o script existir.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testes e build de produção
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 com cache do npm
        uses: actions/setup-node@v4
        with:
          # Mesma versão do Dockerfile (node:20-alpine). Ao subir o Dockerfile, suba aqui também.
          node-version: "20"
          cache: npm

      - name: npm ci
        # --legacy-peer-deps: mesmo comando do Dockerfile e do Jenkinsfile.
        run: npm ci --legacy-peer-deps

      - name: Lint (se existir)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "Sem script \"lint\" no package.json - passo pulado."
          fi

      - name: Liberar sandbox do Chrome (Ubuntu 24.04)
        # O AppArmor do 24.04 bloqueia user namespaces sem privilégio e o Chrome headless pode falhar
        # com "No usable sandbox". Só afeta a VM descartável do runner.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Testes (Karma, ChromeHeadless)
        run: npx ng test --watch=false --browsers=ChromeHeadless --no-progress

      - name: Build de produção
        run: npm run build -- --configuration production

  docker-build:
    name: Build da imagem Docker (sem push)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: thiagoocms/taxify-ui:ci-${{ github.sha }}
          cache-from: type=gha,scope=taxify-ui
          cache-to: type=gha,mode=max,scope=taxify-ui

  # Push no Docker Hub: DESLIGADO por padrão. Só roda em push na master E com a variável de
  # repositório DOCKERHUB_PUSH_ENABLED = "true". Enquanto o Jenkins publicar a imagem, deixe desligado.
  # Publicar a imagem NÃO faz deploy na EC2.
  docker-push:
    name: Push da imagem no Docker Hub (master)
    needs: [build, docker-build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      vars.DOCKERHUB_PUSH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dockerhub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag (mesmo esquema do Jenkins - data + nº da execução)
        id: tag
        run: echo "tag=$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            thiagoocms/taxify-ui:${{ steps.tag.outputs.tag }}
            thiagoocms/taxify-ui:latest
          cache-from: type=gha,scope=taxify-ui

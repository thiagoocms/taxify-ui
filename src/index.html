<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Taxify</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2050a2">
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Abertura: a mesma logo animada do app-loader, enquanto o Angular carrega (o app-root substitui tudo isso). -->
  <app-root>
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        background: #f4f5f9; font-family: 'Poppins', system-ui, sans-serif; color: #8a93a3; font-size: 13px;
        animation: boot-in .4s ease-out .2s both; }
      .boot svg { width: 40px; height: 40px; opacity: .8; }
      @keyframes boot-in { from { opacity: 0 } to { opacity: 1 } }
      .boot .b, .boot .s, .boot .d { transform-box: fill-box; }
      .boot .b { transform-origin: left center; animation: boot-bar 2.2s cubic-bezier(.65, 0, .35, 1) infinite; }
      .boot .s { transform-origin: center top; animation: boot-stem 2.2s cubic-bezier(.65, 0, .35, 1) infinite; }
      .boot .d { transform-origin: center; animation: boot-dot 2.2s ease-out infinite; }
      @keyframes boot-bar { 0% { transform: scaleX(0); opacity: 1 } 25%, 82% { transform: scaleX(1); opacity: 1 } 100% { opacity: 0 } }
      @keyframes boot-stem { 0%, 18% { transform: scaleY(0); opacity: 1 } 42%, 82% { transform: scaleY(1); opacity: 1 } 100% { opacity: 0 } }
      @keyframes boot-dot { 0%, 42% { transform: scale(0); opacity: 1 } 52% { transform: scale(1.3) } 58% { transform: scale(1) translateY(0) }
        66% { transform: scale(1) translateY(-5px) } 74%, 82% { transform: scale(1) translateY(0); opacity: 1 } 100% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .boot, .boot .b, .boot .s, .boot .d { animation: none } }
    </style>
    <div class="boot" role="status">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#2050a2" />
        <rect class="b" x="14" y="14" width="36" height="10" rx="2" fill="#fff" />
        <rect class="s" x="27" y="14" width="10" height="36" rx="2" fill="#fff" />
        <circle class="d" cx="47" cy="46" r="6" fill="#ff741f" />
      </svg>
      <span>Carregando o Taxify...</span>
    </div>
  </app-root>
</body>
</html>

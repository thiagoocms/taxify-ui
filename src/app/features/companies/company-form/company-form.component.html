<form class="form-container" [formGroup]="form" (ngSubmit)="submit()">
  <div class="row">
    <div class="col-md-6 col-sm-12">
      <app-input formControlName="name" label="Nome"></app-input>
    </div>
    <div class="col-md-3 col-sm-6">
      <app-input
        formControlName="documentType"
        label="Documento"
        type="select"
        [options]="documentTypeOptions"
      ></app-input>
    </div>
    <div class="col-md-3 col-sm-6">
      <app-input formControlName="documentNumber" label="Número do documento"></app-input>
    </div>
  </div>

  <h6 class="section-title mt-3">Dados cadastrais (opcional)</h6>
  @if (company?.acessoriasId) {
    <p class="section-hint">Importada do Acessórias (ID {{ company!.acessoriasId }}) - a próxima importação atualiza estes dados.</p>
  }
  <div class="row">
    <div class="col-md-6 col-sm-12">
      <app-input formControlName="tradeName" label="Nome fantasia"></app-input>
    </div>
    <div class="col-md-4 col-sm-8">
      <app-input formControlName="phone" label="Telefone"></app-input>
    </div>
    <div class="col-md-2 col-sm-4">
      <app-input formControlName="uf" label="UF" [maxLength]="2"></app-input>
    </div>
    <div class="col-md-6 col-sm-12">
      <app-input formControlName="taxRegime" label="Regime tributário"></app-input>
    </div>
    <div class="col-md-6 col-sm-12">
      <app-input formControlName="stateRegistration" label="Inscrição estadual"></app-input>
    </div>
    <div class="col-md-6 col-sm-12">
      <app-input formControlName="companyGroup" label="Grupo de empresas"></app-input>
    </div>
    <div class="col-md-6 col-sm-12">
      <app-input formControlName="active" label="Situação" type="select" [options]="activeOptions"></app-input>
    </div>
    <div class="col-md-6 col-sm-6">
      <app-input formControlName="clientSince" label="Cliente desde" type="date"></app-input>
    </div>
    <div class="col-md-6 col-sm-6">
      <app-input formControlName="clientUntil" label="Cliente até" type="date"></app-input>
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-3">
    <app-button label="Cancelar" variant="text" severity="secondary" (onClick)="cancel()"></app-button>
    <app-button
      type="submit"
      [label]="loading() ? 'Salvando...' : 'Salvar'"
      [disabled]="loading()"
    ></app-button>
  </div>
</form>

@if (isEdit) {
  <app-company-subscriptions [companyId]="company!.id!"></app-company-subscriptions>
  <app-company-billing [companyId]="company!.id!"></app-company-billing>
  <app-company-product-fiscal-rules [companyId]="company!.id!"></app-company-product-fiscal-rules>
}

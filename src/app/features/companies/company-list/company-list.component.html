<app-page [pageTitle]="pageTitle()" [pageDescription]="pageDescription()" [pageButtons]="pageButtons()">
  @if (viewMode() === 'list') {
    <div class="toolbar">
      <div class="search-field">
        <app-input label="Buscar por nome" [formControl]="searchControl"></app-input>
      </div>
    </div>

    <app-table [columns]="columns" [data]="companies()" [config]="tableConfig"></app-table>

    @if (loading()) {
      <p class="loading-text">Carregando...</p>
    }

    <app-pagination
      [pageIndex]="pageIndex()"
      [totalPages]="totalPages()"
      (pageIndexChange)="onPageIndexChange($event)"
    ></app-pagination>
  } @else {
    <app-company-form
      [company]="editingCompany()"
      (saved)="onSaved()"
      (cancelled)="closeForm()"
    ></app-company-form>
  }
</app-page>

<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="row">
    <div class="col-md-4 col-sm-12">
      <app-input formControlName="codigoProduto" label="Código do produto"></app-input>
    </div>
    <div class="col-md-8 col-sm-12">
      <app-input formControlName="descricaoProduto" label="Descrição do produto"></app-input>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6 col-sm-12">
      <app-input formControlName="ncmCorreto" label="NCM correto"></app-input>
    </div>
    <div class="col-md-6 col-sm-12">
      <app-input formControlName="cfopCorreto" label="CFOP correto"></app-input>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <app-input formControlName="observacoes" label="Observações" type="textarea"></app-input>
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-3">
    <app-button label="Cancelar" variant="text" severity="secondary" (onClick)="cancel()"></app-button>
    <app-button
      type="submit"
      [label]="loading() ? 'Salvando...' : 'Salvar'"
      [disabled]="loading()"
    ></app-button>
  </div>
</form>

<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="row">
    <div class="col-12">
      <app-input
        formControlName="plan"
        label="Plano"
        type="autocomplete"
        [searchFn]="searchPlans"
        displayField="name"
      ></app-input>
    </div>
    <div class="col-md-6 col-sm-12">
      <app-input formControlName="startDate" label="Início" type="date"></app-input>
    </div>
    <div class="col-md-6 col-sm-12">
      <app-input formControlName="endDate" label="Término" type="date"></app-input>
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-3">
    <app-button label="Cancelar" variant="text" severity="secondary" (onClick)="cancel()"></app-button>
    <app-button
      type="submit"
      [label]="loading() ? 'Salvando...' : 'Salvar'"
      [disabled]="loading()"
    ></app-button>
  </div>
</form>

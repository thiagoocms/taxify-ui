<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="row">
    <div class="col-12">
      <app-input formControlName="name" label="Nome do escritório"></app-input>
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-3">
    <app-button label="Cancelar" variant="text" severity="secondary" (onClick)="cancel()"></app-button>
    <app-button
      type="submit"
      [label]="loading() ? 'Salvando...' : 'Salvar'"
      [disabled]="loading()"
    ></app-button>
  </div>
</form>

@if (isEdit) {
  <app-firm-integrations></app-firm-integrations>
}

<form class="form-container" [formGroup]="form" (ngSubmit)="submit()">
  <div class="row">
    <div class="col-md-6 col-sm-12">
      <app-input formControlName="name" label="Nome"></app-input>
    </div>
    <div class="col-md-6 col-sm-12">
      <app-input formControlName="description" label="Descrição" type="textarea"></app-input>
    </div>
  </div>

  <div class="row" formGroupName="services">
    <label class="services-label col-12">Serviços incluídos</label>
    @for (option of serviceOptions; track option.value) {
      <div class="col-md-6 col-sm-12">
        <app-toggle [label]="option.label" [formControlName]="option.value"></app-toggle>
      </div>
    }
  </div>

  <div class="d-flex justify-content-end gap-2 mt-3">
    <app-button label="Cancelar" variant="text" severity="secondary" (onClick)="cancel()"></app-button>
    <app-button
      type="submit"
      [label]="loading() ? 'Salvando...' : 'Salvar'"
      [disabled]="loading()"
    ></app-button>
  </div>
</form>

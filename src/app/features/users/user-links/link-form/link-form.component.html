<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="row">
    <div class="col-md-8 col-sm-12">
      <app-input
        formControlName="company"
        label="Empresa"
        type="autocomplete"
        [searchFn]="searchCompanies"
        displayField="name"
        displayFieldTooltip="documentNumber"
      ></app-input>
    </div>

    <div class="col-md-4 col-sm-12">
      <app-input formControlName="role" label="Papel / Função"></app-input>
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-3">
    <app-button label="Cancelar" variant="text" severity="secondary" (onClick)="cancel()"></app-button>
    <app-button
      type="submit"
      [label]="loading() ? 'Vinculando...' : 'Vincular'"
      [disabled]="loading()"
    ></app-button>
  </div>
</form>

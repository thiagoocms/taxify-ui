<div class="header-bar">
  <div class="d-flex align-items-center gap-3">
    <button type="button" class="menu-toggle" (click)="menuToggle.emit()" aria-label="Abrir/fechar menu">
      <fa-icon [icon]="menuIcon"></fa-icon>
    </button>
    <span class="brand">
      <span class="brand-mark"><fa-icon [icon]="brandIcon"></fa-icon></span>
      Taxify
    </span>
  </div>

  <div class="user-area">
    <!-- Menu do avatar: Minha conta e Dados do escritório (abre e fecha pelo teclado; Esc fecha). -->
    <div class="user-menu" (keydown.escape)="closeUserMenu(true)">
      <button
        #avatarButton
        type="button"
        class="user-avatar"
        title="Minha conta e dados do escritório"
        aria-label="Menu da conta"
        [attr.aria-controls]="userMenuOpen() ? 'user-menu-panel' : null"
        [attr.aria-expanded]="userMenuOpen()"
        (click)="toggleUserMenu()"
      >
        {{ userInitial }}
      </button>
      @if (userMenuOpen()) {
        <div class="user-menu-panel" id="user-menu-panel">
          <p class="user-menu-name">{{ authService.userName() }}</p>
          <ul>
            <li>
              <a routerLink="/minha-conta" (click)="closeUserMenu()">
                <fa-icon [icon]="accountIcon" aria-hidden="true"></fa-icon> Minha conta
              </a>
            </li>
            <li>
              <button type="button" (click)="openFirmDialog()">
                <fa-icon [icon]="firmIcon" aria-hidden="true"></fa-icon> Dados do escritório
              </button>
            </li>
          </ul>
        </div>
      }
    </div>
    <span class="user-name">{{ authService.userName() }}</span>
    <app-button
      label="Sair"
      icon="right-from-bracket"
      variant="outlined"
      severity="secondary"
      (onClick)="logout()"
    ></app-button>
  </div>
</div>

<app-modal [open]="firmDialogOpen()" title="Dados do escritório" size="xl" (closed)="closeFirmDialog()">
  @if (firmDialogOpen()) {
    @if (firmLoading()) {
      <app-loader variant="section" message="Carregando os dados do escritório..."></app-loader>
    } @else {
      <app-accounting-firm-form
        [firm]="firm()"
        (saved)="onFirmSaved($event)"
        (cancelled)="closeFirmDialog()"
      ></app-accounting-firm-form>
    }
  }
</app-modal>

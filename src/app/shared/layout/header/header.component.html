<div class="header-bar">
  <div class="d-flex align-items-center gap-3">
    <button type="button" class="menu-toggle" (click)="menuToggle.emit()" aria-label="Abrir/fechar menu">
      <fa-icon [icon]="menuIcon"></fa-icon>
    </button>
    <span class="brand">Taxify</span>
  </div>

  <div class="user-area">
    <button
      type="button"
      class="user-avatar"
      title="Editar dados do escritório"
      (click)="openFirmDialog()"
    >
      {{ userInitial }}
    </button>
    <span class="user-name">{{ authService.userName() }}</span>
    <app-button
      label="Sair"
      icon="right-from-bracket"
      variant="outlined"
      severity="secondary"
      (onClick)="logout()"
    ></app-button>
  </div>
</div>

<app-modal [open]="firmDialogOpen()" title="Dados do escritório" (closed)="closeFirmDialog()">
  @if (firmDialogOpen()) {
    @if (firmLoading()) {
      <p class="loading-text">Carregando...</p>
    } @else {
      <app-accounting-firm-form
        [firm]="firm()"
        (saved)="onFirmSaved($event)"
        (cancelled)="closeFirmDialog()"
      ></app-accounting-firm-form>
    }
  }
</app-modal>

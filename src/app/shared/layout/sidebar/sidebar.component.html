<nav class="sidebar-nav">
  <a class="nav-link" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="linkClicked.emit()">
    <fa-icon [icon]="homeIcon"></fa-icon>
    <span>Início</span>
  </a>

  <!-- Menu "Cadastro": cada item aparece conforme as permissões do usuário (Usuários: só administrador). -->
  <ng-container *ngIf="showRegistry">
    <button type="button" class="nav-link nav-group-toggle" (click)="toggleCadastro()">
      <fa-icon [icon]="folderIcon"></fa-icon>
      <span>Cadastro</span>
      <fa-icon class="chevron" [class.open]="cadastroOpen()" [icon]="chevronIcon"></fa-icon>
    </button>

    <div class="nav-group" [class.open]="cadastroOpen()">
      <a
        *ngIf="canCompanies"
        class="nav-link nav-sublink"
        routerLink="/cadastro/empresas"
        routerLinkActive="active"
        (click)="linkClicked.emit()"
      >
        <fa-icon [icon]="buildingIcon"></fa-icon>
        <span>Empresas</span>
      </a>
      <a
        *ngIf="canPlans"
        class="nav-link nav-sublink"
        routerLink="/cadastro/planos"
        routerLinkActive="active"
        (click)="linkClicked.emit()"
      >
        <fa-icon [icon]="tagsIcon"></fa-icon>
        <span>Planos</span>
      </a>
      <a
        *ngIf="isAdmin"
        class="nav-link nav-sublink"
        routerLink="/cadastro/usuarios"
        routerLinkActive="active"
        (click)="linkClicked.emit()"
      >
        <fa-icon [icon]="usersIcon"></fa-icon>
        <span>Usuários</span>
      </a>
    </div>
  </ng-container>

  <a *ngIf="canInvoices" class="nav-link" routerLink="/pendencias" routerLinkActive="active" (click)="linkClicked.emit()">
    <fa-icon [icon]="pendencyIcon"></fa-icon>
    <span>Pendências</span>
  </a>

  <a *ngIf="canInvoices" class="nav-link" routerLink="/notas-fiscais" routerLinkActive="active" (click)="linkClicked.emit()">
    <fa-icon [icon]="invoiceIcon"></fa-icon>
    <span>Notas fiscais</span>
  </a>

  <a *ngIf="canInvoices" class="nav-link" routerLink="/notas-servico" routerLinkActive="active" (click)="linkClicked.emit()">
    <fa-icon [icon]="serviceInvoiceIcon"></fa-icon>
    <span>Notas de serviço</span>
  </a>

  <a *ngIf="canInvoices" class="nav-link" routerLink="/manifestacao" routerLinkActive="active" (click)="linkClicked.emit()">
    <fa-icon [icon]="manifestIcon"></fa-icon>
    <span>Manifestação</span>
  </a>

  <a *ngIf="canInvoices" class="nav-link" routerLink="/retencoes" routerLinkActive="active" (click)="linkClicked.emit()">
    <fa-icon [icon]="retentionIcon"></fa-icon>
    <span>Retenções</span>
  </a>

  <a *ngIf="canInvoices" class="nav-link" routerLink="/auditoria" routerLinkActive="active" (click)="linkClicked.emit()">
    <fa-icon [icon]="auditIcon"></fa-icon>
    <span>Auditoria</span>
  </a>

  <a *ngIf="canAssessment" class="nav-link" routerLink="/apuracao" routerLinkActive="active" (click)="linkClicked.emit()">
    <fa-icon [icon]="assessmentIcon"></fa-icon>
    <span>Apuração</span>
  </a>

  <a class="nav-link" routerLink="/ajuda" routerLinkActive="active" (click)="linkClicked.emit()">
    <fa-icon [icon]="helpIcon"></fa-icon>
    <span>Ajuda</span>
  </a>
</nav>

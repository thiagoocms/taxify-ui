<div class="invoice-mock" aria-hidden="true">
  <div class="invoice-mock-header">
    <span class="invoice-mock-tag">NF-e</span>
    <span class="invoice-mock-barcode"></span>
  </div>
  <div class="invoice-mock-key">{{ mockAccessKey }}</div>
  <div class="invoice-mock-lines">
    <div class="invoice-mock-line">
      <span class="bar bar-lg"></span>
      <span class="value">R$ 4.280,00</span>
    </div>
    <div class="invoice-mock-line">
      <span class="bar bar-md"></span>
      <span class="value">R$ 912,40</span>
    </div>
    <div class="invoice-mock-line">
      <span class="bar bar-sm"></span>
      <span class="value">R$ 156,00</span>
    </div>
  </div>
  <div class="invoice-mock-audited">
    <fa-icon [icon]="auditedIcon"></fa-icon>
    Auditada
  </div>
</div>

<h2>Auditoria contábil sem complicação</h2>
<p class="panel-subtitle">
  Centralize empresas, usuários e auditorias fiscais em uma única plataforma.
</p>

<ul class="panel-features">
  @for (feature of features; track feature.text) {
    <li>
      <span class="feature-icon">
        <fa-icon [icon]="feature.icon"></fa-icon>
      </span>
      {{ feature.text }}
    </li>
  }
</ul>

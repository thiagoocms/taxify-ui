<button
  [type]="type"
  class="btn"
  [ngClass]="[
    getSizeClass(),
    getButtonClass(),
    rounded ? 'rounded-pill' : '',
    styleClass
  ]"
  [disabled]="isDisabled"
  [attr.title]="titleText"
  [attr.data-read-only]="blockedByReadOnly ? '' : null"
  [attr.aria-label]="label || tooltip || null"
  (click)="onButtonClick($event)"
>
  @if(icon){
    <fa-icon
      [class.me-1]="label"
      [icon]="['fas', icon || '']">
    </fa-icon>
  }

  {{ label }}
</button>

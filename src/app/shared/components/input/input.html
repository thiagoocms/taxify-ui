<div class="custom-input-container">
  <label [class.filled]="hasValue || focused || alwaysFloatLabel">{{ label }}</label>

  <div class="wrapper">
    @switch (type) {
      @case ('autocomplete') {
        <input
          [ngClass]="{ 'input-boxed': border, 'invalid': hasErrors, 'with-clear': !!value && !disabled }"
          [disabled]="disabled"
          [value]="value"
          (input)="onInput($event)"
        />
        @if (value && !disabled) {
          <button type="button" class="clear-button" aria-label="Limpar" title="Limpar" (mousedown)="$event.preventDefault()"
            (click)="clear()">
            <fa-icon [icon]="clearIcon"></fa-icon>
          </button>
        }

        @if (showDropdown && suggestions.length > 0) {
          <div class="dialog-container">
            <ul class="results">
              @for (item of suggestions; track $index) {
                <li (click)="onSelect(item)" class="result-item" [title]="itemTooltip(item)">
                  <div class="title">
                    {{ itemLabel(item) }}
                  </div>
                </li>
              }
            </ul>
          </div>
        }
      }
      @case ('textarea') {
        <textarea
          [ngClass]="{ 'input-boxed': border, 'invalid': hasErrors }"
          [disabled]="disabled"
          [maxLength]="maxLength"
          [value]="value"
          (input)="onInput($event)"
          (focus)="focused = true"
          (blur)="onBlur()"
          rows="3"
        ></textarea>
      }
      @case ('select') {
        <select
          [ngClass]="{ 'input-boxed': border, 'invalid': hasErrors }"
          [disabled]="disabled"
          [value]="value"
          (change)="onInput($event)"
          (focus)="focused = true"
          (blur)="onBlur()"
        >
          @if (!value) {
            <option value="" hidden disabled selected></option>
          }
          @for (option of options; track option.value) {
            <!-- [selected] per option: [value] on the <select> is applied before the options exist,
                 so the browser falls back to the first one ("Não informado") on edit forms. -->
            <option [value]="option.value" [selected]="option.value === value">{{ option.label }}</option>
          }
        </select>
      }
      @default {
        <input
          [ngClass]="{ 'input-boxed': border, 'invalid': hasErrors }"
          [type]="type"
          [attr.inputmode]="mask === 'document' ? 'numeric' : null"
          [disabled]="disabled"
          [maxLength]="mask === 'document' ? 18 : maxLength"
          [value]="value"
          (input)="onInput($event)"
          (focus)="focused = true"
          (blur)="onBlur()"
        />
      }
    }

    @if (icon) {
      <div class="input-icon d-flex align-items-center justify-content-center h-100"
           [ngClass]="{
                clickable: clickable
            }"
           (click)="toggle($event)">
        <fa-icon [icon]="icon"></fa-icon>
      </div>
    }
    <div class="underline"></div>
  </div>

  <div *ngIf="hasErrors" class="error-messages active">
    <span *ngFor="let error of errorMessages">{{ error + " " }} </span>
  </div>


</div>
